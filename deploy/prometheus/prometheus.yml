global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Metricas da API, recebidas via OTLP e reexpostas pelo collector.
  - job_name: bookrent-api
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
