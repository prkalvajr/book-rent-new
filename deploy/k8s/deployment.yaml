apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookrent-api
  namespace: bookrent
  labels:
    app.kubernetes.io/name: bookrent-api
spec:
  # Entre 2 e 11 replicas: a aplicacao nao guarda estado em memoria e toda
  # decisao de disponibilidade e resolvida no PostgreSQL.
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bookrent-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookrent-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Encerramento gracioso: tempo para drenar requisicoes em andamento.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: bookrent-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bookrent-api-config
            - secretRef:
                name: bookrent-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Liveness so olha o processo: uma queda de PostgreSQL/Redis nao pode
          # reiniciar pods saudaveis em cascata.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness olha as dependencias: sem banco/cache o pod sai do Service.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
