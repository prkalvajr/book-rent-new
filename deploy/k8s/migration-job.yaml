# Migrations rodam UMA vez por versao, antes do rollout dos pods da API.
# Rodar migration no startup de N replicas gera corrida no lock de migration
# e acopla o schema ao ciclo de vida do pod.
#
# Requer um bundle gerado com:
#   dotnet ef migrations bundle --project src/BookRent.Infrastructure \
#     --startup-project src/BookRent.Api --self-contained -o efbundle
# ou uma imagem que contenha o SDK e o codigo.

apiVersion: batch/v1
kind: Job
metadata:
  name: bookrent-migrations
  namespace: bookrent
  labels:
    app.kubernetes.io/name: bookrent-migrations
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookrent-migrations
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrations
          image: bookrent-migrations:local
          envFrom:
            - secretRef:
                name: bookrent-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
