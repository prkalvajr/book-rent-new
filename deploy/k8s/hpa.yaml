apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bookrent-api
  namespace: bookrent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bookrent-api
  # Faixa citada no desafio: a corretude nao depende do numero de replicas.
  minReplicas: 2
  maxReplicas: 11
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
