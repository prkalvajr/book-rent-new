apiVersion: v1
kind: ConfigMap
metadata:
  name: bookrent-api-config
  namespace: bookrent
  labels:
    app.kubernetes.io/name: bookrent-api
data:
  # Apenas configuracao nao sensivel. Credenciais vivem no Secret.
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"
  # Desligado de proposito: com varias replicas a migration roda no Job dedicado
  # (migration-job.yaml) como etapa anterior ao rollout.
  Database__MigrateOnStartup: "false"
  Cache__DefaultTtl: "00:05:00"
  Cache__InstanceName: "bookrent:"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_SERVICE_NAME: "bookrent-api"
