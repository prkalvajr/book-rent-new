# Exemplo de estrutura do Secret — SEM valores reais.
# Em producao use External Secrets, Sealed Secrets ou o secret store do provedor;
# nunca versione o Secret preenchido (deploy/k8s/secret.yaml esta no .gitignore).
#
# Para criar localmente:
#   kubectl -n bookrent create secret generic bookrent-api-secrets \
#     --from-literal=ConnectionStrings__Postgres='Host=...;Database=...;Username=...;Password=...;Maximum Pool Size=8' \
#     --from-literal=ConnectionStrings__Redis='redis-master:6379,password=...,abortConnect=false'
#
# ATENCAO ao "Maximum Pool Size": esta connection string SOBRESCREVE inteira a do
# appsettings.json, entao o limite precisa vir aqui — nao adianta configura-lo la.
# O pool e por processo. Com o maxReplicas=11 do hpa.yaml:
#     11 replicas x 8 conexoes = 88, contra os ~97 uteis do max_connections=100 padrao
#     (o PostgreSQL reserva algumas para superusuario).
# Passar do teto do pool faz a requisicao esperar; passar do max_connections faz o
# servidor RECUSAR com 53300 too_many_connections. Se aumentar maxReplicas ou o pool,
# refaca a conta — ou coloque um PgBouncer em modo transaction na frente.

apiVersion: v1
kind: Secret
metadata:
  name: bookrent-api-secrets
  namespace: bookrent
  labels:
    app.kubernetes.io/name: bookrent-api
type: Opaque
stringData:
  ConnectionStrings__Postgres: "REPLACE_ME"
  ConnectionStrings__Redis: "REPLACE_ME"
